name: "Pull Request Checks"

on:
  pull_request:

jobs:
  ##
  # validation
  ##

  validate_pr_title:
    name: "Validate PR Title"
    runs-on: ubuntu-latest
    steps:
      - name: "🛎 Checkout"
        uses: actions/checkout@v4
      - name: "🔧 Setup"
        uses: ./.github/actions/use-flutter-dependencies
      - name: "📥 Get PR Title"
        id: get_pr_title
        uses: actions/github-script@v7
        with:
          result-encoding: string
          script: |
            const { data } = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.payload.pull_request.number
            });
            return data.title;
      - name: "✅ Validate"
        run: echo "${{ steps.get_pr_title.outputs.result }}" | dart run commitlint_cli

  ##
  # build
  ##

  build_android:
    name: "Build Android"
    needs: [validate_pr_title]
    runs-on: ubuntu-latest
    environment: development
    steps:
      - name: "🛎 Checkout"
        uses: actions/checkout@v4
      - name: "🔧 Setup"
        uses: ./.github/actions/use-flutter-dependencies
      - name: "🏗️ Build AppBundle"
        run: make build-android-debug

#  build_ios:
#    name: "Build iOS"
#    needs: [validate_pr_title]
#    runs-on: macos-latest
#    environment: development
#    steps:
#      - name: "🛎 Checkout"
#        uses: actions/checkout@v4
#      - name: "🔧 Setup"
#        uses: ./.github/actions/use-flutter-dependencies
#      - name: "🏗️ Build ios"
#        run: make build-ios-debug

  tests:
    name: "Tests"
    needs: [validate_pr_title]
    runs-on: ubuntu-latest
    environment: development
    steps:
      - name: "🛎 Checkout"
        uses: actions/checkout@v4
      - name: "🔧 Setup"
        uses: ./.github/actions/use-flutter-dependencies
      - name: "🧪 Test"
        run: make test
