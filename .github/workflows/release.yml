name: "Release"

on:
  workflow_call:
    inputs:
      environment:
        required: true
        type: string
    secrets:
      WRITE_REPOS_TOKEN:
        required: true

jobs:
  release:
    name: "Release"
    permissions:
      contents: write # to be able to publish a github release
      issues: write # to be able to comment on released issues
      pull-requests: write # to be able to comment on released pull requests
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    steps:
      - name: "🛎 Checkout"
        uses: actions/checkout@v4
      - name: "🔧 Setup pnpm"
        uses: pnpm/action-setup@v4
        with:
          run_install: |
            - recursive: true
            - args: ["--global", "semantic-release@25.0.2", "@semantic-release/changelog@6.0.3", "@semantic-release/exec@7.1.0", "@semantic-release/git@10.0.1"]
          version: '10'
      - name: "🔧 Setup Node"
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: "🔖 Release"
        env:
          # appears on the release commits
          GIT_AUTHOR_NAME: agoralabs-bot
          GIT_AUTHOR_EMAIL: tech@agoralabs.sh
          GIT_COMMITTER_NAME: agoralabs-bot
          GIT_COMMITTER_EMAIL: tech@agoralabs.sh
          # used to push the release commit and create the tags
          GITHUB_TOKEN: ${{ secrets.WRITE_REPOS_TOKEN }}
        run: pnpm exec semantic-release
