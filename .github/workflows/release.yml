name: "Release"

on:
  workflow_call:
    inputs:
      environment:
        required: true
        type: string
    secrets:
      READ_AND_WRITE_REPOS_TOKEN:
        required: true

jobs:
  release:
    name: "Release"
    permissions:
      contents: write # to be able to publish a github release
      issues: write # to be able to comment on released issues
      pull-requests: write # to be able to comment on released pull requests
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    steps:
      - name: "🛎 Checkout"
        uses: actions/checkout@v4
      - name: "🔧 Setup pnpm"
        uses: pnpm/action-setup@v4
      - name: "🔧 Setup Node"
        uses: actions/setup-node@v4
        with:
          node-version: '20.18.0'
          cache: 'pnpm'
      - name: "📦 Install"
        run: |
          pnpm add semantic-release @semantic-release/{changelog,commit-analyzer,exec,git,github,release-notes-generator}
      - name: "🔖 Release"
        env:
          # appears on the release commits
          GIT_AUTHOR_NAME: kieranroneill
          GIT_AUTHOR_EMAIL: hello@kieranoneill.com
          GIT_COMMITTER_NAME: kieranroneill
          GIT_COMMITTER_EMAIL: hello@kieranoneill.com
          # used to push the release commit and create the tags
          GITHUB_TOKEN: ${{ secrets.READ_AND_WRITE_REPOS_TOKEN }}
        run: pnpm exec semantic-release
