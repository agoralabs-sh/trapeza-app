name: "Use Flutter Dependencies"

description: "Installs the Flutter SDK and a project dependencies with caching."

runs:
  using: "composite"
  steps:
    - name: "☕ Set up Java"
      uses: actions/setup-java@v3
      with:
        java-version: "17"
        distribution: "zulu"
    - name: "🔧 Setup"
      uses: subosito/flutter-action@v2
      with:
        channel: stable
        cache: false
        flutter-version: 3.38.0
    - name: "💾 Cache dependencies"
      uses: actions/cache@v4
      id: cache-dependencies
      with:
        path: ${{ github.workspace }}/.pub-cache
        key: ${{ runner.os }}-pub-cache-${{ hashFiles('pubspec.lock') }}
    - name: "Set PUB_CACHE env"
      run: echo "PUB_CACHE=${{ github.workspace }}/.pub-cache" >> $GITHUB_ENV
      shell: bash
    - name: "📦 Install"
      if: steps.cache-dependencies.outputs.cache-hit != 'true'
      run: flutter pub get
      shell: bash
